<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>offishall stores</title>
        <link rel="stylesheet" href="checkoutstyles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
    <body>
        <header>
            <div class="logo"><i class="fa-solid fa-bag-shopping"></i><span class="offishall">OFFISHALL</span> <span class="stores">STORES</span></div>
            <div class="nav-icons">
                <div class="icon">
                <i class="fas fa-bell"></i>
                </div>
                <div class="icon">
                    <i class="fas fa-user"></i>
                    <span id="usernameNav">John Doe</span>
                </div>
                <div class="icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <div class="logout-buttons">
                    <button class="btn logout" id="logoutBtn">Logout</button>
                </div>
            </div>
        </header>

        <div class="checkout container">
            <div class="shipping column">
                <form id="shipping address">
                    <label for="firstname">First Name</label>
                    <input id="name" type="text" placeholder="First Name" required>
                    <label for="lastname">Last Name</label>
                    <input id="lastname" type="text" placeholder="Last Name" required>
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="E-mail" required>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone-code">Phone number</label>
                            <select id="phone-code" name="phone-code">
                                <option value="+234">🇳🇬 +234</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+33">FR +33</option>
                                <option value="+49">DE +49</option>
                                <option value="+44">GB +44</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number </label>
                            <input type="tel" id="phone" name="phone" placeholder="8078507313" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" name="country">
                            <option value="">Select country</option>
                            <option value="NG">🇳🇬 Nigeria</option>
                            <option value="DE">🇩🇪 Germany</option>
                            <option value="GB">🇬🇧 Great Britain</option>
                            <option value="FR">🇫🇷 France</option>
                            <option value="US">🇺🇸 USA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <select id="state" name="state" disabled>
                            <option value="">Select country first</option>
                        </select>
                    </div>
                    <label for="address">Address</label>
                    <input id="address" type="text" placeholder="Address" required>
                    <div class="form-group">
                        <label>Shipping Method</label>
                        <div class="shipping-method-options">
                            <label class="shipping-card">
                                <input type="radio" name="shipping-method" value="door" checked />
                                <div class="shipping-card-content">
                                    <span class="shipping-title">Door Delivery</span>
                                    <span class="shipping-price">$5</span>
                                </div>
                                <span class="shipping-time">2-5 Days</span>
                            </label>
                            <label class="shipping-card">
                                <input type="radio" name="shipping-method" value="pickup" />
                                <div class="shipping-card-content">
                                    <span class="shipping-title">Pick-up Station</span>
                                    <span class="shipping-price">$2</span>
                                </div>
                                <span class="shipping-time">1-3 Days</span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="cart-column">
                <div id="checkout-cart-items"></div>
                <div class="cart-totals">
                    <div>Subtotal <span id="subtotal">₦0</span></div>
                    <div>Shipping <span id="shipping-cost">₦0</span></div>
                    <div class="total-row">Total <span id="total">₦0</span></div>
                </div>
                <button type="submit" form="shipping address" class="continue-btn">Continue to Payment</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
